name: Build DIV SONG AI final Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON//[[:space:]]/}" ]]; then
            echo "::error title=Firebase configuration missing::The repository secret GOOGLE_SERVICES_JSON is empty or unavailable to this workflow run."
            echo "Recreate GOOGLE_SERVICES_JSON in Settings > Secrets and variables > Actions using the complete google-services.json contents."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" |
            sed '/^[[:space:]]*\`\`\`[[:alnum:]_-]*[[:space:]]*$/d' |
            sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > app/google-services.json

          test -s app/google-services.json
          python3 -m json.tool app/google-services.json >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("app/google-services.json").read_text())
          package_name = "com.divsongai.app"
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package_name
              for c in data.get("client", [])
          ):
              raise SystemExit(f"google-services.json does not contain an Android client for {package_name}")
          print("Firebase configuration validated for com.divsongai.app")
          PY

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64//[[:space:]]/}" ]]; then
            echo "::error title=Release keystore missing::KEYSTORE_BASE64 is empty or unavailable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > divsongai-release.jks
          test -s divsongai-release.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/divsongai-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename final APK
        run: cp app/build/outputs/apk/release/app-release.apk DIV-SONG-AI-final.apk

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIV-SONG-AI-final-signed-apk
          path: DIV-SONG-AI-final.apk
          if-no-files-found: error
          retention-days: 30
